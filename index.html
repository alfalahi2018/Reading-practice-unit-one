<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match It! Entertainment Jobs and Places</title>
<style>
:root{--ink:#2b1442;--pur:#8a2a6b;--sun:#ffc233;--ok:#1fa774;--bad:#e5484d;--bg:#fbf3fa}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--pur);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.25rem}h1 small{display:block;font-weight:400;font-size:.8rem;opacity:.85}
.sc{background:var(--sun);color:var(--ink);border-radius:20px;padding:4px 14px;font-weight:700}
main{max-width:900px;margin:0 auto;padding:14px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:14px}
.tab{border:2px solid var(--pur);background:#fff;border-radius:12px;padding:8px;font:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.tab.on{background:var(--pur);color:#fff}.tab b{display:block}.tab span{font-size:.8rem}
.box{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:2px solid #ecd3e6}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.cols{grid-template-columns:1fr}}
.it{border:2px solid var(--ink);padding:8px 10px;margin-bottom:8px;border-radius:6px;font-size:.95rem}.it b{margin-right:6px}
h3.c{margin:0 0 6px}
table{width:100%;border-collapse:collapse;margin:14px 0;text-align:center}th,td{border:2px solid var(--ink);padding:4px}th{background:#f3e3ef}td.n{font-weight:700;width:44px}
.bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer;padding:0}
.bub.s{background:var(--pur);box-shadow:inset 0 0 0 4px #fff}.bub.ok{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 4px #fff}.bub.no{background:var(--bad);border-color:var(--bad);box-shadow:inset 0 0 0 4px #fff}.bub.ans{box-shadow:0 0 0 4px var(--ok)}
.btn{font:inherit;font-weight:700;border:0;border-radius:24px;padding:10px 22px;background:var(--ink);color:#fff;cursor:pointer;margin:4px 4px 4px 0}.btn.y{background:var(--sun);color:var(--ink)}.btn:disabled{opacity:.5}
.fb{font-size:.92rem;margin:3px 0}.g{color:#0d7a53}.b{color:#b3262b}
.o{font:inherit;border:2px solid var(--ink);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;margin:4px 4px 4px 0;text-align:left;color:var(--ink)}.o.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.o.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.big{font-size:3rem;font-weight:700;margin:0}.bar{height:12px;background:#ecd9e7;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
footer{text-align:center;padding:18px;font-size:.9rem}button:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
</style></head><body>
<header><h1>Match It! Entertainment Jobs and Places<small>Grade 7 English · Unit 1 · Choose any round, in any order</small></h1><div class="sc" id="sc">Score 0 / 20</div></header>
<main id="app"></main><footer>Created by T.Badria Alfalahi</footer>
<script>
/* SCORM 1.2 */
var api=null,t0=Date.now();
function findAPI(w){var n=0;while(!w.API&&w.parent&&w.parent!==w&&n++<10)w=w.parent;return w.API||null}
try{api=findAPI(window)||(window.opener?findAPI(window.opener):null)}catch(e){}
function sc(k,v){try{if(api)api.LMSSetValue(k,String(v))}catch(e){}}
function st(){var s=Math.round((Date.now()-t0)/1000),p=function(n){return(n<10?"0":"")+n};return p(Math.floor(s/3600))+":"+p(Math.floor(s%3600/60))+":"+p(s%60)}
try{if(api){api.LMSInitialize("");var ls=api.LMSGetValue("cmi.core.lesson_status");if(!ls||ls==="not attempted")sc("cmi.core.lesson_status","incomplete");sc("cmi.core.score.min",0);sc("cmi.core.score.max",20)}}catch(e){}
function push(d){sc("cmi.core.score.raw",total());if(d)sc("cmi.core.lesson_status",total()>=10?"passed":"failed");sc("cmi.core.session_time",st());try{if(api)api.LMSCommit("")}catch(e){}}
window.addEventListener("beforeunload",function(){push(false);try{if(api)api.LMSFinish("")}catch(e){}});
/* Data: [text, statement, emoji, answer name] */
var R=[
{n:"Round 1",d:"Jobs on screen and stage",ic:"🎬",tip:"Look for key words: clothes = costume designer, camera = camera operator, dangerous = stunt performer.",
 it:[["This person makes the clothes that actors wear in plays and films.","She draws and sews amazing outfits for the characters at the theatre.","🧵","costume designer"],
 ["This person films the show or the film with a camera.","He holds the camera and records every scene of the film.","🎥","camera operator"],
 ["This person does dangerous action scenes instead of the actor.","He jumps from buildings and crashes cars safely in action films.","🤸","stunt performer"],
 ["This person plays a character in a film or a play.","She learns her lines and acts the part of a queen on stage.","🎭","actor"],
 ["This person works with music and sound in a studio.","He mixes music and sound effects for the final film.","🎧","sound engineer"]],
 x:["She walks on a high rope above the crowd.","🎪"]},
{n:"Round 2",d:"Jobs in shows",ic:"🎪",tip:"Read the whole text, not just one word. Red nose + big shoes = clown. Strings + screen = puppeteer.",
 it:[["This person does amazing tricks in a big tent.","She walks on a high rope and juggles balls under the big top.","🤹","circus performer"],
 ["This person makes children laugh with silly clothes and tricks.","He wears big shoes and a red nose and falls over on purpose.","🤡","clown"],
 ["This person controls toys in a show.","She moves the puppets with strings behind a wooden screen.","🪆","puppeteer"],
 ["This person talks to the audience on television.","He speaks to the camera and introduces the programme.","📺","TV presenter"],
 ["This person tells jokes to make people laugh.","She tells funny jokes on stage and the whole room laughs.","🎤","comedian"]],
 x:["He takes visitors around the gallery and explains the paintings.","🖼️"]},
{n:"Round 3",d:"Places of entertainment 1",ic:"🏙️",tip:"Think about what you DO in each place: watch films, skate, bowl, look at paintings.",
 it:[["You go here to watch films on a big screen.","You buy popcorn and sit in the dark to watch the latest film.","🍿","cinema"],
 ["You go here to see plays and musicals.","Actors perform on a stage and the audience sits in rows of seats.","🎭","theatre"],
 ["You go here to skate.","You wear boots with blades and glide on the ice.","⛸️","ice rink"],
 ["You go here to play a game with a heavy ball.","You roll a ball down a lane and knock down the pins.","🎳","bowling alley"],
 ["You go here to look at pictures and exhibitions.","You can see paintings and photos, and a guide tells you about them.","🖼️","art gallery"]],
 x:["You sit under a dome and watch the stars.","🔭"]},
{n:"Round 4",d:"Places of entertainment 2",ic:"🎢",tip:"Match the activity to the place: swing and bridges = adventure playground; wild animals = safari park.",
 it:[["You go here to learn about space.","You sit under a dome and watch shows about stars and planets.","🔭","planetarium"],
 ["You go here to climb and play outside.","You climb, swing and cross bridges high above the ground.","🌉","adventure playground"],
 ["You go here to see wild animals.","You drive through and see giraffes and lions from the car.","🦒","safari park"],
 ["You go here to learn about science.","You press buttons and try experiments with your family.","🔬","science museum"],
 ["You go here for rides and fun.","You scream on the roller coaster and eat candy floss.","🎢","amusement park"]],
 x:["You climb a hill to see old walls and towers.","🏰"]}];
var O,P,C,cur=0,done=false;
function shuf(a){return a.sort(function(){return Math.random()-.5})}
function build(){O=R.map(function(r){return shuf(r.it.map(function(x,i){return{s:x[1],e:x[2],k:i}}).concat([{s:r.x[0],e:r.x[1],k:-1}]))});P=R.map(function(){return[null,null,null,null,null]});C=R.map(function(){return false})}
function ans(r,i){return O[r].findIndex(function(o){return o.k===i})}
function rs(r){var n=0;if(C[r])for(var i=0;i<5;i++)if(P[r][i]===ans(r,i))n++;return n}
function total(){var n=0;for(var r=0;r<R.length;r++)n+=rs(r);return n}
var L="ABCDEF";
function $(i){return document.getElementById(i)}
function pick(r,i,j){if(C[r])return;P[r][i]=j;draw()}
function check(r){if(P[r].indexOf(null)>=0){alert("Shade one bubble in every row first.");return}C[r]=true;push(false);draw()}
function go(i){cur=i;done=false;draw()}
function draw(){
 $("sc").textContent="Score "+total()+" / 20";
 var h='<div class="tabs">'+R.map(function(r,i){return '<button class="tab'+(i===cur&&!done?" on":"")+'" onclick="go('+i+')"><b>'+r.ic+" "+r.n+'</b><span>'+r.d+" · "+(C[i]?rs(i)+"/5 ✔":"not checked")+"</span></button>"}).join("")+"</div>";
 if(done){$("app").innerHTML=h+result();return}
 var r=cur,d=R[r];
 h+='<div class="box"><h2 style="margin-top:0">'+d.ic+" "+d.n+": "+d.d+'</h2><p><i>Match the five texts on the left with the statements on the right. Shade in the bubble under the correct option. There is one extra statement!</i></p><div class="cols"><div><h3 class="c">Texts</h3>'
 +d.it.map(function(x,i){return '<div class="it"><b>'+(i+1)+"-</b>"+x[0]+"</div>"}).join("")+'</div><div><h3 class="c">Statements</h3>'
 +O[r].map(function(o,j){return '<div class="it"><b>'+L[j]+".</b>"+o.e+" "+o.s+"</div>"}).join("")+"</div></div>";
 h+="<table><tr><th></th>"+L.split("").map(function(c){return"<th>"+c+"</th>"}).join("")+"</tr>";
 for(var i=0;i<5;i++){h+='<tr><td class="n">'+(i+1)+".</td>";for(var j=0;j<6;j++){var c="bub";if(P[r][i]===j)c+=C[r]?(j===ans(r,i)?" ok":" no"):" s";if(C[r]&&j===ans(r,i)&&P[r][i]!==j)c+=" ans";h+='<td><button class="'+c+'" aria-label="'+(i+1)+" "+L[j]+'" onclick="pick('+r+","+i+","+j+')"></button></td>'}h+="</tr>"}
 h+="</table>";
 if(C[r]){h+="<h3 class=c>Feedback: "+rs(r)+" / 5</h3>";for(var i=0;i<5;i++){var a=ans(r,i);h+='<div class="fb '+(P[r][i]===a?"g":"b")+'">'+(i+1)+". "+(P[r][i]===a?"✔ Correct: "+L[a]+" is the "+d.it[i][3]+".":"✖ The correct answer is "+L[a]+" ("+d.it[i][3]+").")+"</div>"}h+="<p>💡 "+d.tip+"</p>"}
 else h+='<button class="btn y" onclick="check('+r+')">Check my answers</button>';
 h+="</div>";
 h+='<button class="btn" onclick="finish()">See my final mark</button>';
 $("app").innerHTML=h}
function finish(){var un=C.filter(function(c){return!c}).length;if(un&&!confirm(un+" round(s) not checked yet. Unchecked rounds will be marked now. Continue?"))return;C=C.map(function(){return true});done=true;push(true);draw();scrollTo(0,0)}
function grade(n){return n>=18?["A","Excellent! Outstanding work.","🏆"]:n>=15?["B","Very good! Just a few points to polish.","🌟"]:n>=12?["C","Good effort. Review the mistakes below.","👍"]:n>=10?["D","You passed. Practise the weaker rounds again.","🙂"]:["E","Not yet. Do the reinforcement tasks and try again!","💪"]}
function result(){
 var n=total(),g=grade(n),h='<div class="box" style="text-align:center"><div style="font-size:2.5rem">'+g[2]+'</div><p class="big">'+n+' / 20</p><p><b>Grade '+g[0]+" · "+n*5+"%</b></p><p>"+g[1]+"</p><p>"+(n>=10?"Status: Passed":"Status: Not yet passed")+"</p></div>";
 h+='<div class="box"><h3 style="margin-top:0">Feedback by round</h3>';
 R.forEach(function(d,r){var c=rs(r);h+="<p><b>"+d.ic+" "+d.n+": "+d.d+"</b> — "+c+" / 5 · "+(c===5?"Perfect!":c>=3?"Good. Check the tip.":"Needs more practice.")+'</p><div class="bar"><i style="width:'+c*20+'%"></i></div>'+(c<5?'<p style="font-size:.9rem">💡 '+d.tip+"</p>":"")});
 h+="</div>";
 var W=[];R.forEach(function(d,r){for(var i=0;i<5;i++)if(P[r][i]!==ans(r,i))W.push([r,i])});
 if(W.length){h+='<div class="box"><h3 style="margin-top:0">Reinforcement: try these again (not scored)</h3>';
  W.forEach(function(w,k){var r=w[0],i=w[1],d=R[r],opts=shuf([d.it[i][1]].concat(shuf(d.it.filter(function(_,z){return z!==i}).map(function(x){return x[1]})).slice(0,2)));
   h+='<div style="margin-bottom:14px"><p><b>'+(k+1)+". "+d.it[i][0]+'</b></p>'+opts.map(function(o){return '<button class="o" data-r="'+r+'" data-i="'+i+'" onclick="rp(this)">'+o+"</button>"}).join("")+'<div class="fb" id="f'+r+"_"+i+'"></div></div>'});
  h+="</div>"}else h+='<div class="box">🎉 No mistakes to review. Perfect score!</div>';
 return h+'<button class="btn" onclick="again()">↻ Play again</button>'}
function rp(b){var r=+b.dataset.r,i=+b.dataset.i,d=R[r],f=$("f"+r+"_"+i);if(b.textContent===d.it[i][1]){b.className="o ok";f.className="fb g";f.textContent="✔ Yes! This is the "+d.it[i][3]+"."}else{b.className="o no";f.className="fb b";f.textContent="✖ Try again. Read the key words."}}
function again(){build();cur=0;done=false;t0=Date.now();sc("cmi.core.lesson_status","incomplete");draw()}
build();draw();
</script></body></html>
